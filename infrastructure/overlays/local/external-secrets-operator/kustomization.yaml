resources:
  - ../../../base/external-secrets-operator/
  - ./secretstore.yaml
  - ./externalsecret.yaml
  - ./grafana-externalsecret.yaml

helmCharts:
  - name: external-secrets-operator
    includeCRDs: true
    valuesFile: ../../../base/external-secrets-operator/local-values.yaml
