apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.192.168.174.195.sslip.io`)
      priority: 10
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: default
